name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All actions pinned to commit SHAs (tag in comment) - a moved or
  # compromised tag can no longer change what CI executes.
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:invariants
      - run: npm run test:formats
      # DEVOPS 3/4 rust gates: the platform layer (fs, watcher, protocol,
      # decide_post allowlist) is security-relevant and carries the
      # `adversarial` suite - it must block merge like the TS gates do.
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      # Dependency audits run once on the ubuntu leg - identical inputs
      # on every OS would only triple the audit-DB fetches.
      - name: npm audit (high and above)
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high
      - name: cargo audit
        if: matrix.os == 'ubuntu-latest'
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # FOSS gates activate when code exists:
      # - run: npx reuse lint

  # Full-history secret scan on every push/PR. gitleaks-action is free
  # for personal accounts; org repos need a GITLEAKS_LICENSE secret.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
