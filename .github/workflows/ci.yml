name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:invariants
      - run: npm run test:formats
      # FOSS gates activate when code exists:
      # - run: npx reuse lint
