name: release

# Tag-triggered installer builds. Windows is the shipping platform today;
# macOS/Linux legs activate once those bundle targets are verified in CI
# (webkit2gtk/system deps make them non-trivial to validate blind).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm run build -w @box/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: the-box-windows
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/**/*
          fail_on_unmatched_files: true
