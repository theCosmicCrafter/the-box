[package]
name = "the-box"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "The Box - local-first infinite canvas over real files"

[lib]
name = "the_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
trash = "5"
rfd = "0.15"
opener = { version = "0.9", features = ["reveal"] }
percent-encoding = "2"
http-range = "0.1"
base64 = "0.23"
systemicons = "0.9.13"
image = "0.25"
ureq = "3"
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Ole",
] }
